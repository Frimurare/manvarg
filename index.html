<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manvarg</title>
    <meta name="description" content="Manvarg – musik av Ulf Holmström. Lyssna på Spotify och YouTube Music. Kontakt: uffe.holmstrom@gmail.com">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="canonical" href="https://manvarg.se/">
    <meta property="og:title" content="Manvarg">
    <meta property="og:description" content="Lyssna på Manvarg på Spotify och YouTube Music. Kontakt: uffe.holmstrom@gmail.com">
    <meta property="og:url" content="https://manvarg.se/">
    <meta property="og:image" content="https://manvarg.se/assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #111111;
            --muted: #6b6b6b;
            --line: #e6e6e6;
            --spotify: #1DB954;
            --youtube: #FF0000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 16px 40px;
            text-align: center;
        }
        main { width: 100%; max-width: 680px; display: flex; flex-direction: column; align-items: center; gap: 36px; }
        .logo { width: min(420px, 80vw); height: auto; display: block; }
        h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
        .lead { font-size: 1.1rem; color: var(--muted); max-width: 46ch; }
        .links { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 24px; border-radius: 999px;
            font-weight: 600; font-size: 1rem; text-decoration: none;
            color: #fff; transition: transform .12s ease, opacity .12s ease;
        }
        .btn:hover { transform: translateY(-1px); opacity: .92; }
        .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
        .btn svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
        .btn-spotify { background: var(--spotify); }
        .btn-youtube { background: var(--youtube); }
        .player { width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
        .player iframe { display: block; width: 100%; height: 352px; border: 0; }
        .contact {
            width: 100%; padding: 28px 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
        }
        .contact .label { text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
        .contact a {
            font-size: clamp(1.25rem, 4.5vw, 1.75rem); font-weight: 700; color: var(--fg);
            text-decoration: none; border-bottom: 2px solid var(--fg); word-break: break-all;
        }
        .contact a:hover { color: var(--spotify); border-color: var(--spotify); }
        .contact p { margin-top: 10px; color: var(--muted); font-size: .95rem; }
        footer { margin-top: auto; padding-top: 40px; color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: 12px; }
        .mail-icon { display: inline-flex; color: var(--fg); }
        .mail-icon svg { width: 22px; height: 22px; fill: currentColor; }
        .mail-icon:hover { color: var(--spotify); }
        .mail-icon:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; border-radius: 4px; }
        @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="assets/images/logo.png" alt="Manvarg">

        <div class="links">
            <a class="btn btn-spotify" href="https://open.spotify.com/artist/1tDrz9RD0NeK2ni1LSZtBg" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.5 17.32a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.55-1.16a.75.75 0 1 1-.33-1.46c4.57-1.04 8.5-.59 11.66 1.34.35.22.46.68.25 1.03zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.98-8.15-2.56-11.97-1.4a.94.94 0 1 1-.54-1.8c4.36-1.32 9.78-.68 13.49 1.6.44.27.58.85.31 1.29zm.13-3.4C15.25 8.35 8.9 8.14 5.2 9.26a1.13 1.13 0 1 1-.65-2.16c4.25-1.29 11.3-1.04 15.76 1.61a1.13 1.13 0 0 1-1.21 1.94z"/></svg>
                Lyssna på Spotify
            </a>
            <a class="btn btn-youtube" href="https://music.youtube.com/channel/UCZ328DLkQSnhR-dSIDq0bTQ" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm0 19.1A7.1 7.1 0 1 1 12 4.9a7.1 7.1 0 0 1 0 14.2zm0-12.8a5.7 5.7 0 1 0 0 11.4 5.7 5.7 0 0 0 0-11.4zM9.9 15.2V8.8L15.4 12l-5.5 3.2z"/></svg>
                YouTube Music
            </a>
        </div>

        <div class="player">
            <iframe title="Manvarg på Spotify" src="https://open.spotify.com/embed/artist/1tDrz9RD0NeK2ni1LSZtBg?utm_source=generator" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>

        <section class="contact" id="kontakt">
            <div class="label">Contact</div>
            <a href="mailto:uffe.holmstrom@gmail.com">uffe.holmstrom@gmail.com</a>
        </section>
    </main>

    <footer>
        <span>© 2026 Manvarg · Ulf Holmström</span>
        <a class="mail-icon" href="mailto:uffe.holmstrom@gmail.com" aria-label="E-post" title="uffe.holmstrom@gmail.com">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.4 7l6.6 4.4L18.6 7H5.4z"/></svg>
        </a>
    </footer>
</body>
</html>
